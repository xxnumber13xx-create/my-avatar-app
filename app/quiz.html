<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EAF6FF">
<title>🔢 さんすう クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; flex-direction: column;
    background:
      radial-gradient(circle at 10% 10%, #DDF4E4, transparent 40%),
      radial-gradient(circle at 90% 0%, #FFE9C7, transparent 35%),
      var(--bg);
  }
  .draw-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: #fff;
    border-bottom: 2px solid #EDE9FF;
    flex: 0 0 auto;
  }
  .draw-header h1 {
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    margin: 0; font-size: 18px; color: var(--purple);
    flex: 1; line-height: 1.1;
  }
  .back-btn {
    background: #F4F1FF; border: 2px solid #DCD5FF; color: var(--purple);
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    border-radius: 12px; padding: 8px 12px; cursor: pointer; font-size: 14px;
  }
  .main-scroll {
    flex: 1; overflow-y: auto;
    padding: 20px 14px calc(24px + var(--sab));
    display: flex; flex-direction: column;
    gap: 14px;
    max-width: 540px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }

  /* ==== 学年ピッカー ==== */
  .grade-card {
    background: #fff; border: 3px solid #DCD5FF;
    border-radius: 20px; padding: 18px;
    box-shadow: 0 6px 0 rgba(124,111,242,0.14);
  }
  .grade-card h2 {
    margin: 0 0 8px; text-align: center;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: 20px; color: var(--ink);
  }
  .grade-card .sub {
    text-align: center; margin: 0 0 14px;
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    line-height: 1.5;
  }
  .grade-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .grade-btn {
    background: linear-gradient(180deg, #DDF4E4, #A8E4C4);
    border: 3px solid #4CD4B0; border-radius: 14px;
    padding: 14px 4px; cursor: pointer;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    color: #1F5A40; font-size: 13px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 4px 0 #4CD4B0;
    transition: transform .08s, box-shadow .08s;
  }
  .grade-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #4CD4B0; }
  .grade-btn .icon { font-size: 22px; }
  .grade-btn .label { font-size: 11px; opacity: 0.8; font-weight: 700; }

  /* ==== 問題カード ==== */
  .quiz-card {
    background: #fff; border-radius: 22px;
    border: 3px solid #4CD4B0;
    padding: 22px 18px;
    box-shadow: 0 6px 0 rgba(76,212,176,0.28);
    text-align: center;
    position: relative;
  }
  .quiz-progress {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: 12px; color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .quiz-progress .grade-tag {
    background: linear-gradient(180deg, #DDF4E4, #A8E4C4);
    border: 2px solid #4CD4B0; color: #1F5A40;
    padding: 3px 10px; border-radius: 999px; font-size: 11px;
  }
  .quiz-progress .count {
    color: var(--purple);
  }
  .quiz-type-tag {
    display: inline-block;
    background: linear-gradient(180deg, #FFF3C9, #FFE1A0);
    border: 2px solid #E8A200; color: #7A5200;
    padding: 3px 12px; border-radius: 999px;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: 11px; margin: 2px 0 0;
  }
  .quiz-suffix {
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: 20px; color: var(--ink-soft);
    margin-left: -4px;
  }
  .quiz-question {
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: clamp(28px, 8vw, 44px);
    color: var(--ink);
    letter-spacing: 2px;
    margin: 18px 0 22px;
    line-height: 1.3;
  }
  .quiz-question .op { color: #C63A6A; margin: 0 6px; }
  .quiz-question .eq { color: var(--purple); margin: 0 6px; }
  .quiz-answer-row {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .quiz-answer-input {
    width: 130px; height: 60px;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: 32px; text-align: center;
    border: 3px solid #DCD5FF; border-radius: 14px;
    background: #FAF8FF;
    color: var(--ink); outline: none;
    -moz-appearance: textfield;
  }
  .quiz-answer-input::-webkit-outer-spin-button,
  .quiz-answer-input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .quiz-answer-input:focus { border-color: var(--purple); background: #fff; }
  .quiz-submit {
    padding: 14px 24px;
    background: linear-gradient(180deg, #FFDCEA, #FFB6D0);
    border: 3px solid #E14E7F; border-radius: 14px;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    color: #C63A6A; font-size: 15px;
    cursor: pointer; box-shadow: 0 4px 0 #C63A6A;
    transition: transform .08s, box-shadow .08s;
  }
  .quiz-submit:active { transform: translateY(2px); box-shadow: 0 2px 0 #C63A6A; }
  .quiz-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .quiz-feedback {
    margin: 12px 0 0;
    padding: 14px 16px;
    border-radius: 14px;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: 15px;
    display: none;
  }
  .quiz-feedback.show { display: block; animation: fbPop .35s ease; }
  @keyframes fbPop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .quiz-feedback.correct {
    background: linear-gradient(180deg, #E8FFF3, #C7F3D6);
    border: 3px solid #4CD4B0;
    color: #1F5A40;
  }
  .quiz-feedback.wrong {
    background: linear-gradient(180deg, #FFE8EC, #FFB8C7);
    border: 3px solid #E14E7F;
    color: #C63A6A;
  }
  .quiz-feedback .earned {
    display: inline-block; margin-left: 8px;
    background: linear-gradient(180deg, #FFF3C9, #FFD966);
    color: #7A5200; border: 2px solid #E8A200;
    padding: 2px 10px; border-radius: 999px; font-size: 13px;
  }
  .quiz-nav {
    display: flex; gap: 10px; margin-top: 12px;
  }
  .quiz-nav button {
    flex: 1; padding: 12px;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    border-radius: 12px; cursor: pointer;
    font-size: 14px;
    transition: transform .08s, box-shadow .08s;
  }
  .quiz-nav button:active { transform: translateY(2px); }
  .quiz-nav .btn-next {
    background: linear-gradient(180deg, #E4DAF5, #C9B4F0);
    border: 3px solid #7C6FF2; color: #5D51CC;
    box-shadow: 0 4px 0 #7C6FF2;
  }
  .quiz-nav .btn-next:active { box-shadow: 0 2px 0 #7C6FF2; }
  .quiz-nav .btn-back {
    background: #F4F1FF; border: 2px solid #DCD5FF; color: var(--purple);
  }

  /* ==== 集計カード (10問完走時) ==== */
  .result-card {
    background: #fff; border: 3px solid #FFD966;
    border-radius: 22px; padding: 22px 18px;
    box-shadow: 0 6px 0 rgba(232,162,0,0.35);
    text-align: center;
  }
  .result-card h2 {
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    color: #7A5200; margin: 0 0 6px; font-size: 22px;
  }
  .result-score {
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: 40px; color: var(--purple); margin: 12px 0;
  }
  .result-earned {
    background: linear-gradient(180deg, #FFF3C9, #FFD966);
    border: 3px solid #E8A200; color: #7A5200;
    padding: 10px 18px; border-radius: 14px;
    display: inline-block; margin-top: 8px;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: 18px;
  }
  .result-actions {
    display: flex; gap: 10px; margin-top: 16px;
  }
  .result-actions button {
    flex: 1; padding: 12px;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    border-radius: 12px; cursor: pointer;
    font-size: 13px;
  }
  .result-actions .btn-again {
    background: linear-gradient(180deg, #DDF4E4, #A8E4C4);
    border: 3px solid #4CD4B0; color: #1F5A40;
    box-shadow: 0 4px 0 #4CD4B0;
  }
  .result-actions .btn-again:active { transform: translateY(2px); box-shadow: 0 2px 0 #4CD4B0; }
  .result-actions .btn-home {
    background: #F4F1FF; border: 2px solid #DCD5FF; color: var(--purple);
  }
  .cap-note {
    background: #FFF8E5; border: 2px solid #FFD966;
    color: #7A5200; padding: 10px 14px; border-radius: 12px;
    font-size: 12px; font-weight: 700; text-align: center;
    margin-top: 4px;
  }
  .today-note {
    text-align: center; margin: 2px 0 0;
    font-size: 11px; font-weight: 700; color: var(--ink-soft);
    line-height: 1.5;
  }
</style>
</head>
<body>
<header class="draw-header">
  <button class="back-btn" onclick="window.location.href='/'">← もどる</button>
  <h1>🔢 さんすう クイズ</h1>
</header>

<main class="main-scroll" id="mainScroll">
  <div id="gradePickerArea">
    <div class="grade-card">
      <h2>🎓 なんねん の もんだいに する？</h2>
      <p class="sub">10もん セット。まちがえても だいじょうぶ！<br>せいかい 1もん あたり +2G ✨</p>
      <div class="grade-grid" id="gradeGrid">
        <button class="grade-btn" data-grade="1"><span class="icon">1️⃣</span><span>1ねん</span><span class="label" data-label-for="1">たしざん</span></button>
        <button class="grade-btn" data-grade="2"><span class="icon">2️⃣</span><span>2ねん</span><span class="label" data-label-for="2">ひきざん</span></button>
        <button class="grade-btn" data-grade="3"><span class="icon">3️⃣</span><span>3ねん</span><span class="label" data-label-for="3">かけざん</span></button>
        <button class="grade-btn" data-grade="4"><span class="icon">4️⃣</span><span>4ねん</span><span class="label" data-label-for="4">わりざん</span></button>
        <button class="grade-btn" data-grade="5"><span class="icon">5️⃣</span><span>5ねん</span><span class="label" data-label-for="5">こんごう</span></button>
        <button class="grade-btn" data-grade="6"><span class="icon">6️⃣</span><span>6ねん</span><span class="label" data-label-for="6">むずかしい</span></button>
      </div>
    </div>
    <p class="today-note">🗓️ きょうの もんだい は 学年ごとに 3しゅるい ローテーション。あすは ちがう もんだいが でるよ！</p>
    <div class="cap-note" id="capNote"></div>
  </div>

  <div id="quizArea" style="display:none"></div>
  <div id="resultArea" style="display:none"></div>
</main>

<script type="module">
import { isAllowanceConfigured, getStoredChildKey, setStoredChildKey,
  watchAllowance, listAllowanceChildren, earnGold, updateAllowanceChild } from '/shared/firebase.js';
import { setupGoldBadge, showToast, showGoldFly } from '/shared/utils.js';

const header = document.querySelector('header');
const api = setupGoldBadge(
  { isAllowanceConfigured, getStoredChildKey, setStoredChildKey,
    watchAllowance, listAllowanceChildren, earnGold, updateAllowanceChild },
  header, null
);
window.avatarAppGold = api;

// ============================================================
// クイズ 生成: ローカル アルゴリズム（Gemini 呼ばない）
// ============================================================
// 学年ごとに複数の問題タイプを用意し、日付シードで「きょう出すタイプの並び」を
// 決定的に決める（同じ日は同じ並び、日が変われば変わる）。utils.js の
// getDailyTopics と同じ考え方（日付文字列ハッシュ→Fisher-Yatesシャッフル）を
// quiz.html 内で完結させたローカル実装。
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** 日付文字列（YYYYMMDD）から決定的な擬似乱数を作る簡易ハッシュ（utils.js と同ロジック） */
function seededRandom(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) {
    h = (h * 31 + seedStr.charCodeAt(i)) >>> 0;
  }
  return function () {
    h ^= h << 13; h >>>= 0;
    h ^= h >> 17;
    h ^= h << 5; h >>>= 0;
    return (h % 100000) / 100000;
  };
}
function todayYmd(date = new Date()) {
  return `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}`;
}

// 学年ごとの問題タイプ定義。各タイプは { key, label, gen: () => {display, answer} } を持つ。
const PROBLEM_TYPES = {
  1: [
    { key: 'add1', label: 'たしざん',
      gen: () => { const a = randInt(1, 9), b = randInt(1, 9); return { display: `${a} + ${b}`, answer: a + b }; } },
    { key: 'sub1', label: 'ひきざん',
      gen: () => { const a = randInt(2, 9), b = randInt(1, a); return { display: `${a} - ${b}`, answer: a - b }; } },
    { key: 'make10', label: '10のかたまり',
      gen: () => { const a = randInt(1, 9); return { display: `${a} + ？ = 10`, answer: 10 - a }; } }
  ],
  2: [
    { key: 'sub2', label: 'ひきざん',
      gen: () => { const a = randInt(5, 20), b = randInt(1, a); return { display: `${a} - ${b}`, answer: a - b }; } },
    { key: 'carry_add', label: 'くり上がり たしざん',
      gen: () => { const a = randInt(10, 30), b = randInt(1, 9); return { display: `${a} + ${b}`, answer: a + b }; } },
    { key: 'order', label: '大きい数の じゅんばん',
      gen: () => {
        const nums = new Set();
        while (nums.size < 3) nums.add(randInt(1, 99));
        const arr = shuffle([...nums]);
        const max = Math.max(...arr);
        return { display: `いちばん 大きいのは？ ${arr.join(' ・ ')}`, answer: max, freeform: true };
      } }
  ],
  3: [
    { key: 'mul_all', label: 'かけざん (九九)',
      gen: () => { const a = randInt(2, 9), b = randInt(2, 9); return { display: `${a} × ${b}`, answer: a * b }; } },
    { key: 'mul_3', label: '3のだん しゅうちゅう',
      gen: () => { const b = randInt(1, 9); return { display: `3 × ${b}`, answer: 3 * b }; } },
    { key: 'div_intro', label: 'わりざん にゅうもん',
      gen: () => { const b = randInt(2, 5), q = randInt(2, 5); const a = b * q; return { display: `${a} ÷ ${b}`, answer: q }; } }
  ],
  4: [
    { key: 'div4', label: 'わりざん',
      gen: () => { const b = randInt(2, 9), q = randInt(2, 9); const a = b * q; return { display: `${a} ÷ ${b}`, answer: q }; } },
    { key: 'mul_2digit', label: '2けた×1けた',
      gen: () => { const a = randInt(11, 40), b = randInt(2, 9); return { display: `${a} × ${b}`, answer: a * b }; } },
    { key: 'div_rem', label: 'あまりの あるわりざん',
      gen: () => {
        const b = randInt(2, 9), q = randInt(2, 9), r = randInt(1, b - 1);
        const a = b * q + r;
        return { display: `${a} ÷ ${b} の あまりは？`, answer: r };
      } }
  ],
  5: [
    { key: 'mixed5', label: 'こんごう けいさん',
      gen: () => {
        const t = Math.random();
        if (t < 0.5) { const a = randInt(2, 12), b = randInt(2, 9), c = randInt(1, 9); return { display: `${a} × ${b} + ${c}`, answer: a * b + c }; }
        const a = randInt(10, 20), b = randInt(1, Math.min(9, a - 1)), c = randInt(1, 9);
        return { display: `${a} - ${b} + ${c}`, answer: a - b + c };
      } },
    { key: 'frac_add', label: 'ぶんすうの たしざん',
      gen: () => {
        const d = randInt(3, 8); // 分母
        const a = randInt(1, d - 2); // 和が d 未満になるよう a は最大 d-2 まで
        const b = randInt(1, d - 1 - a);
        return { display: `${a}/${d} + ${b}/${d}`, answer: a + b, suffix: `/${d}` };
      } },
    { key: 'decimal', label: '小数の たしひき',
      gen: () => {
        const a = randInt(10, 99) / 10, b = randInt(10, 99) / 10;
        const isAdd = Math.random() < 0.5;
        const ans = Math.round((isAdd ? a + b : Math.abs(a - b)) * 10) / 10;
        return { display: `${a.toFixed(1)} ${isAdd ? '+' : '-'} ${b.toFixed(1)}`, answer: ans, decimal: true };
      } }
  ],
  6: [
    { key: 'paren', label: 'カッコ けいさん',
      gen: () => { const a = randInt(2, 15), b = randInt(2, 15), c = randInt(2, 9); return { display: `( ${a} + ${b} ) × ${c}`, answer: (a + b) * c }; } },
    { key: 'big_mul', label: '大きい数の かけざん',
      gen: () => { const a = randInt(10, 30), b = randInt(2, 12); return { display: `${a} × ${b}`, answer: a * b }; } },
    { key: 'percent', label: 'わりあいの にゅうもん',
      gen: () => {
        const base = randInt(2, 20) * 10; // 20,30,...,200
        const pct = [10, 20, 25, 50][randInt(0, 3)];
        return { display: `${base} の ${pct}% は？`, answer: Math.round(base * pct / 100) };
      } }
  ]
};

/** その日の学年ごとの出題タイプ配列（日付シードで決定的にシャッフル）。1日1回計算してキャッシュ。 */
const _dailyTypeCache = {};
function getDailyTypes(grade) {
  if (_dailyTypeCache[grade]) return _dailyTypeCache[grade];
  const types = PROBLEM_TYPES[grade];
  const ymd = todayYmd();
  const rand = seededRandom(ymd + '_g' + grade);
  const pool = types.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  _dailyTypeCache[grade] = pool;
  return pool;
}

/** 10問ぶんの問題セットを生成。その日のタイプ並びをできるだけ均等にくり返して割り当てる。 */
function generateProblemSet(grade, count = 10) {
  const types = getDailyTypes(grade);
  const seq = [];
  for (let i = 0; i < count; i++) seq.push(types[i % types.length]);
  shuffle(seq);
  return seq.map(t => ({ ...t.gen(), typeLabel: t.label }));
}

function todayTypeLabelsText(grade) {
  return getDailyTypes(grade).map(t => t.label).join(' / ');
}

// ============================================================
// 1日ボーナス上限管理
// ============================================================
const DAILY_QUIZ_GOLD_CAP = 20; // 1日で貰える上限
const CORRECT_REWARD = 2;

function ymd() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getDailyEarned() {
  try { return Number(localStorage.getItem('avatarApp_quizGold_' + ymd()) || 0); } catch (e) { return 0; }
}
function addDailyEarned(n) {
  try {
    const cur = getDailyEarned();
    localStorage.setItem('avatarApp_quizGold_' + ymd(), String(cur + n));
    return cur + n;
  } catch (e) { return 0; }
}
function refreshCapNote() {
  const earned = getDailyEarned();
  const left = Math.max(0, DAILY_QUIZ_GOLD_CAP - earned);
  const note = document.getElementById('capNote');
  if (left <= 0) {
    note.innerHTML = `🌟 きょうは もう ${DAILY_QUIZ_GOLD_CAP}G ぜんぶ もらったよ！ あそぶだけ でも OK ♪`;
  } else {
    note.innerHTML = `きょう もらえる のこり: <b>${left}G</b> / ${DAILY_QUIZ_GOLD_CAP}G`;
  }
}
refreshCapNote();

// 学年ボタン下のラベルを「きょうのタイプ」の先頭2つに書き換える
document.querySelectorAll('[data-label-for]').forEach(el => {
  const grade = Number(el.dataset.labelFor);
  const types = getDailyTypes(grade);
  el.textContent = types.slice(0, 2).map(t => t.label).join('・');
});

// ============================================================
// セッション
// ============================================================
const session = {
  grade: null,
  problems: [],
  index: 0,
  correct: 0,
  goldEarned: 0,
  currentAnswered: false
};

document.querySelectorAll('.grade-btn').forEach(b => {
  b.addEventListener('click', () => startQuiz(Number(b.dataset.grade)));
});

function startQuiz(grade) {
  session.grade = grade;
  session.problems = generateProblemSet(grade, 10);
  session.index = 0;
  session.correct = 0;
  session.goldEarned = 0;
  session.currentAnswered = false;
  document.getElementById('gradePickerArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = '';
  renderProblem();
}

function renderProblem() {
  const q = session.problems[session.index];
  const wrap = document.getElementById('quizArea');
  const expr = tokenize(q.display);
  const isDecimal = !!q.decimal;
  const suffix = q.suffix || '';
  wrap.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-progress">
        <span class="grade-tag">🎓 ${session.grade}ねん</span>
        <span class="count">${session.index + 1} / ${session.problems.length}</span>
      </div>
      <div class="quiz-type-tag">${q.typeLabel || ''}</div>
      <div class="quiz-question">${expr} <span class="eq">=</span> <span style="color:var(--ink-soft)">?</span></div>
      <div class="quiz-answer-row">
        <input type="number" inputmode="${isDecimal ? 'decimal' : 'numeric'}" ${isDecimal ? 'step="0.1"' : 'pattern="[0-9]*"'} class="quiz-answer-input" id="answerInput" autocomplete="off" />${suffix ? `<span class="quiz-suffix">${suffix}</span>` : ''}
        <button class="quiz-submit" id="submitBtn">✓ こたえる</button>
      </div>
      <div class="quiz-feedback" id="feedback"></div>
      <div class="quiz-nav" id="navRow" style="display:none">
        <button class="btn-back" id="btnQuit">🏠 やめる</button>
        <button class="btn-next" id="btnNext">➡️ つぎの もんだい</button>
      </div>
    </div>
  `;
  session.currentAnswered = false;
  const input = document.getElementById('answerInput');
  const submit = document.getElementById('submitBtn');
  input.focus();
  const doSubmit = () => {
    if (session.currentAnswered) return;
    const val = input.value.trim();
    if (val === '') { showToast('こたえを かいてね'); return; }
    handleAnswer(Number(val));
  };
  submit.addEventListener('click', doSubmit);
  input.addEventListener('keypress', e => {
    if (e.key === 'Enter') doSubmit();
  });
}

function tokenize(display) {
  // 演算子に color を付けるためだけの装飾
  return display
    .replace(/\+/g, '<span class="op">+</span>')
    .replace(/-/g, '<span class="op">-</span>')
    .replace(/×/g, '<span class="op">×</span>')
    .replace(/÷/g, '<span class="op">÷</span>');
}

async function handleAnswer(userAnswer) {
  session.currentAnswered = true;
  const q = session.problems[session.index];
  const correct = q.decimal
    ? Math.abs(userAnswer - q.answer) < 0.05
    : userAnswer === q.answer;
  const fb = document.getElementById('feedback');
  const nav = document.getElementById('navRow');
  document.getElementById('submitBtn').disabled = true;

  if (correct) {
    session.correct += 1;
    // 上限内なら +2G
    const earned = getDailyEarned();
    const canEarn = earned < DAILY_QUIZ_GOLD_CAP;
    const willEarn = canEarn ? CORRECT_REWARD : 0;
    if (willEarn > 0) {
      const childKey = api.getChildKey();
      if (childKey) {
        try {
          await earnGold(childKey, willEarn, `${session.grade}ねんクイズ せいかい`);
          showGoldFly(willEarn);
          addDailyEarned(willEarn);
          session.goldEarned += willEarn;
        } catch (e) { console.warn(e); }
      }
    }
    fb.className = 'quiz-feedback correct show';
    fb.innerHTML = `🎉 せいかい！ ${willEarn > 0 ? `<span class="earned">+${willEarn}G</span>` : '<span class="earned" style="background:#EFECFA;color:#5D51CC;border-color:#DCD5FF;">きょうは じょうげん</span>'}`;
  } else {
    fb.className = 'quiz-feedback wrong show';
    const answerText = q.decimal ? q.answer.toFixed(1) : `${q.answer}${q.suffix || ''}`;
    fb.innerHTML = `😢 ざんねん... こたえは <b>${answerText}</b> だよ`;
  }
  nav.style.display = '';
  document.getElementById('btnNext').addEventListener('click', () => {
    session.index += 1;
    if (session.index >= session.problems.length) {
      showResult();
    } else {
      renderProblem();
    }
  });
  document.getElementById('btnQuit').addEventListener('click', showResult);
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  const wrap = document.getElementById('resultArea');
  wrap.style.display = '';
  const total = session.index + (session.currentAnswered ? 1 : 0);
  const rate = total > 0 ? Math.round((session.correct / total) * 100) : 0;
  const encouragement = rate >= 80 ? '🌟 すごい！' : rate >= 50 ? '👍 いいね！' : '💪 もう1かい やってみよう！';
  wrap.innerHTML = `
    <div class="result-card">
      <h2>${encouragement}</h2>
      <div class="result-score">${session.correct} / ${total}</div>
      <div>${rate}% せいかい</div>
      ${session.goldEarned > 0 ? `<div class="result-earned">💰 +${session.goldEarned}G ゲット！</div>` : ''}
      <div class="result-actions">
        <button class="btn-again" id="btnAgain">🔁 もう1かい</button>
        <button class="btn-home" id="btnHome">🏠 メニュー</button>
      </div>
    </div>
  `;
  document.getElementById('btnAgain').addEventListener('click', () => {
    document.getElementById('resultArea').style.display = 'none';
    document.getElementById('gradePickerArea').style.display = '';
    refreshCapNote();
  });
  document.getElementById('btnHome').addEventListener('click', () => {
    window.location.href = '/';
  });
}
</script>
</body>
</html>
